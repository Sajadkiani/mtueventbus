name: Publish NuGet Package

on:
  push:
    tags:
      - '*.*.*'

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ./mtueventbus/MtuEventBus.csproj

      - name: Build
        run: dotnet build ./mtueventbus/MtuEventBus.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test ./mtueventbus/MtuEventBus.csproj --configuration Release --no-build


  publish:
    name: Pack and Publish NuGet
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Restore
        run: dotnet restore ./mtueventbus/MtuEventBus.csproj

      - name: Build
        run: dotnet build ./mtueventbus/MtuEventBus.csproj --configuration Release --no-restore

      - name: Verify DLL
        run: |
          echo "Looking for MtuEventBus.dll..."
          find . -name "MtuEventBus.dll" -print

      - name: Pack
        run: |
          dotnet pack ./mtueventbus/MtuEventBus.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            -p:PackageVersion="$VERSION"

      - name: Publish to NuGet
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
