image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - test
  - pack
  - publish

variables:
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

cache:
  paths:
    - .nuget/packages/

before_script:
  - dotnet --info

test:
  stage: test
  script:
    - dotnet restore
    - dotnet build --configuration Release --no-restore
    - dotnet test --configuration Release --no-build

pack:
  stage: pack
  script:
    - dotnet restore
    - dotnet pack --configuration Release --no-restore
      -p:PackageVersion=$CI_COMMIT_TAG
      -o ./packages
  artifacts:
    paths:
      - packages/*.nupkg
      - packages/*.snupkg
  rules:
    - if: $CI_COMMIT_TAG

publish:
  stage: publish
  script:
    - dotnet nuget push "./packages/*.nupkg"
      --source "$NUGET_SOURCE"
      --api-key "$NUGET_API_KEY"
      --skip-duplicate
  rules:
    - if: $CI_COMMIT_TAG